# Reviews chess.com games with native Stockfish 19 on GitHub's runners, using
# the app's own review code, and keeps the results as a downloadable artifact.
# `npm run pull-reviews` downloads them; Insights imports them.
#
# Run it by hand for a full history (split across parallel jobs). The daily
# schedule reviews only games from the last three days. The app starts runs
# for the games it has no review of (game_ids), and resummarize runs rebuild
# every earlier run's summaries in the current format without Stockfish.
name: Review games

on:
  workflow_dispatch:
    inputs:
      mode:
        description: review, or resummarize to rebuild summaries from earlier runs' reviews
        default: review
      game_ids:
        description: Only these games, as encoded by src/github/gameIds.ts (empty for since_days)
        default: ''
      depth:
        description: Engine depth
        default: '16'
      username:
        description: chess.com username (empty for the CHESS_USERNAME repository variable)
        default: ''
      since_days:
        description: Only games that ended in the last N days (0 for every game)
        default: '0'
      shards:
        description: Parallel jobs to split the games across
        default: '16'
      limit:
        description: At most this many games per job, for test runs (0 for no limit)
        default: '0'
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read
  # Resummarize downloads earlier runs' artifacts.
  actions: read

# A daily run waits for a long manual run instead of racing it.
concurrency:
  group: review-games

env:
  # A fork sets its player with the CHESS_USERNAME repository variable
  # (setting up from the app's Settings does it); only the original repo has a default.
  USERNAME: ${{ inputs.username || vars.CHESS_USERNAME || (github.repository_owner == 'Yehuda-Levy923' && 'yehuda_levy') || '' }}
  SINCE_DAYS: ${{ inputs.since_days || '3' }}
  SHARDS: ${{ inputs.shards || '1' }}
  LIMIT: ${{ inputs.limit || '0' }}
  GAME_IDS: ${{ inputs.game_ids || '' }}
  DEPTH: ${{ inputs.depth || '16' }}
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
  STOCKFISH_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f

jobs:
  plan:
    if: ${{ inputs.mode != 'resummarize' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - name: Check the player is set
        run: |
          if [ -z "$USERNAME" ]; then
            echo "::error::No chess.com username. Set the CHESS_USERNAME repository variable (Settings, Secrets and variables, Actions, Variables), or set up GitHub reviews from the app's Settings."
            exit 1
          fi
      - id: list
        run: echo "shards=[$(seq -s, 0 $((SHARDS - 1)))]" >> "$GITHUB_OUTPUT"

  review:
    needs: plan
    runs-on: ubuntu-latest
    # Jobs on GitHub-hosted runners are stopped at six hours; the script stops
    # taking new games well before that so what it finished still gets uploaded.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Stockfish 19
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sf.tar.gz" "$STOCKFISH_URL"
          echo "$STOCKFISH_SHA256  $RUNNER_TEMP/sf.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sf.tar.gz" -C "$RUNNER_TEMP"
          echo "ENGINE=$RUNNER_TEMP/stockfish/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"
      - name: Review
        run: >
          node scripts/ci-review.mjs --user "$USERNAME" --engine "$ENGINE"
          --shard ${{ matrix.shard }} --shards "$SHARDS" --since-days "$SINCE_DAYS"
          --ids "$GAME_IDS" --depth "$DEPTH" --limit "$LIMIT" --max-minutes 330 --out ci-out
      - uses: actions/upload-artifact@v7
        with:
          name: reviews-shard${{ matrix.shard }}
          path: ci-out/
          retention-days: 90
          # The reviews are gzipped already.
          compression-level: 0

  resummarize:
    if: ${{ inputs.mode == 'resummarize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download earlier runs' reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh run list --repo "$GITHUB_REPOSITORY" --workflow review.yml --status completed --limit 300 --json databaseId --jq '.[].databaseId' |
            while read -r id; do
              gh run download "$id" --repo "$GITHUB_REPOSITORY" --dir "prev/run-$id" --pattern 'reviews-*' || echo "run $id: nothing to download"
            done
      - name: Rebuild summaries
        run: node scripts/ci-resummarize.mjs --in prev --out ci-out
      - uses: actions/upload-artifact@v7
        with:
          name: summaries
          path: ci-out/
          retention-days: 90
          compression-level: 0
